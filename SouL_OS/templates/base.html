<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    
    <!-- Navigation Bar -->
    <nav class="bg-indigo-600 p-4 text-white shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between font-bold">
            <a href="{% url 'task_list' %}" class="text-xl">LifeTracker</a>
            <div class="space-x-4">
                <a href="{% url 'task_list' %}" class="hover:text-indigo-200">To-Dos</a>
                <!-- We will add Finance and Gym links here later -->
            </div>
        </div>
    </nav>

    <!-- Main Content Injection Point -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        {% block content %}
        <!-- Individual pages will inject their specific HTML here -->
        {% endblock %}
    </main>

</body>
</html>
